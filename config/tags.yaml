# Curated tag taxonomy for default feeds.
# Each tag matches an article when:
#   - any keyword (substring) appears in title+summary (lowercased), OR
#   - any source_tag (case-insensitive) appears in the article's tags list.
tags:
  - id: ai
    label: AI
    description: LLMs, agents, frontier models, safety, alignment.
    keywords:
      - " ai "
      - "ai-"
      - " ml "
      - llm
      - llms
      - gpt
      - claude
      - gemini
      - openai
      - anthropic
      - deepmind
      - mistral
      - llama
      - transformer
      - diffusion
      - neural network
      - machine learning
      - generative ai
      - alignment
      - rlhf
      - foundation model
      - frontier model
      - inference
      - fine-tune
      - agent
      - agents
    source_tags: [ai, ml, llm, gpt, openai, anthropic, machine-learning]

